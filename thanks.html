<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're on the list — Vault Clerk</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#121315;color:#EFE9DC;font:400 17px/1.6 Inter,system-ui,sans-serif;text-align:center;padding:24px}
h1{font:600 clamp(40px,6vw,56px)/1.05 "Cormorant Garamond",Georgia,serif;margin:24px 0 12px}
p{color:#B9B4A8;margin:0 auto 12px;max-width:480px}
.tag{font:italic 500 22px/1.3 "Cormorant Garamond",Georgia,serif;color:#D4AF6A;margin-bottom:28px}
a{display:inline-block;padding:12px 24px;border-radius:24px;border:1px solid #B8935A;color:#D4AF6A;text-decoration:none;font-weight:600}
svg{width:96px;height:96px}
.spin{transform-box:fill-box;transform-origin:center;animation:s 14s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div>
  <svg viewBox="0 0 120 120" aria-hidden="true"><g class="spin"><circle cx="60" cy="60" r="54" fill="none" stroke="#C9C6BF" stroke-width="3"/><g stroke="#C9C6BF" stroke-width="4" stroke-linecap="round"><path d="M60 60V18"/><path d="M60 60V18" transform="rotate(60 60 60)"/><path d="M60 60V18" transform="rotate(120 60 60)"/><path d="M60 60V18" transform="rotate(180 60 60)"/><path d="M60 60V18" transform="rotate(240 60 60)"/><path d="M60 60V18" transform="rotate(300 60 60)"/></g><g fill="#D4AF6A"><circle cx="60" cy="15" r="7"/><circle cx="60" cy="15" r="7" transform="rotate(60 60 60)"/><circle cx="60" cy="15" r="7" transform="rotate(120 60 60)"/><circle cx="60" cy="15" r="7" transform="rotate(180 60 60)"/><circle cx="60" cy="15" r="7" transform="rotate(240 60 60)"/><circle cx="60" cy="15" r="7" transform="rotate(300 60 60)"/></g><circle cx="60" cy="60" r="15" fill="#D4AF6A"/></g></svg>
  <h1>Thanks, you're on the list.</h1>
  <p class="tag">Turn the wheel. Your files are in.</p>
  <p>We invite people in small groups. If you're in the next one, your invite and download link will come by email.</p>
  <p style="margin-bottom:28px">Beta testers get a free licence at launch.</p>
  <a href="/">Back to Vault Clerk</a>
</div>
</body>
